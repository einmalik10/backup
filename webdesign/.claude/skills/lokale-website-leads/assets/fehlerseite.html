<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht erreichbar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#fff;color:#202124;min-height:100vh}
.box{max-width:600px;margin:0 auto;padding:110px 24px 40px}
.icon{width:72px;height:72px;margin-bottom:34px}
h1{font-size:26px;font-weight:500;margin:0 0 18px}
p{font-size:15px;line-height:1.6;color:#5f6368;margin:0 0 10px}
b{color:#202124}
code{display:inline-block;margin-top:22px;font-size:12px;color:#5f6368;letter-spacing:.02em}
.btn{display:inline-block;margin-top:34px;background:#1a73e8;color:#fff;border-radius:4px;padding:9px 22px;font-size:14px}
.note{position:fixed;left:0;right:0;bottom:0;background:#202124;color:#fff;font-size:12px;text-align:center;padding:6px}
@media(max-width:600px){.box{padding-top:60px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="box">
  <svg class="icon" viewBox="0 0 72 72" aria-hidden="true"><rect x="10" y="14" width="52" height="40" rx="4" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M10 24h52" stroke="#5f6368" stroke-width="3"/><path d="M28 36l16 12M44 36L28 48" stroke="#5f6368" stroke-width="3" stroke-linecap="round"/></svg>
  <h1>Diese Website ist nicht erreichbar</h1>
  <p>Die Server-IP-Adresse von <b id="d"></b> wurde nicht gefunden.</p>
  <p id="t">Die Domain existiert nicht mehr oder ist nicht mehr mit einem Server verbunden.</p>
  <code id="c">DNS_PROBE_FINISHED_NXDOMAIN</code><br>
  <span class="btn">Neu laden</span>
</div>
<div class="note">Nachgestellte Darstellung · so sieht es aus, wenn Kunden Ihre Adresse aufrufen</div>
<script>
var D = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
document.getElementById('d').textContent = D.domain || '';
if (D.text) document.getElementById('t').textContent = D.text;
if (D.code) document.getElementById('c').textContent = D.code;
</script>
</body>
</html>
